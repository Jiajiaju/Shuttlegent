<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shuttlegent mark animation capture</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; }
#sheet { position: relative; }
#sheet svg { position: absolute; display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="mark-defs"></defs></svg>
<div id="sheet"></div>
<script>
// Version D "woven picks" of the Shuttlegent mark animation.
// ExportMarkAnim.mjs injects the mark paths with setMarkPaths(), then calls renderSheet() once per sheet and screenshots it.
(() => {
  const NS = "http://www.w3.org/2000/svg";
  // Shuttle axis in mark space, degrees (principal axis of the master shuttle path)
  const AXIS = -26.835;
  // Shuttle half-length and half-width along / across the axis, with margin
  const S_LEN = 172, S_HALF = 36;
  // Warp columns: inner x, width, strips per warp
  const W_X = 30, W_W = 36, W_STRIPS = 4;
  // Strip overlap in output pixels once picks close, and the gap below which picks count as closed
  const SEAM_OVERLAP_PX = 1.5, GAP_EPSILON = 1e-3;

  const ease = {
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  };
  const seg = (t, a, b, f = ease.inOut) => t <= a ? 0 : t >= b ? 1 : f((t - a) / (b - a));
  const weave = (t, n, start, each, step, f = ease.out) => {
    const a = [];
    for (let i = 0; i < n; i++) a.push(seg(t, start + i * step, start + i * step + each, f));
    return a;
  };
  const full = () => new Array(2 * W_STRIPS).fill(1);

  // Pose: warp[] and picks[] reveal 0..1, gap 0..1 between picks, ghost opacity of the shuttle underlay
  const MOTIONS = {
    intro: { dur: 1800, loop: false, pose: (t, n) => ({ warp: weave(t, 2 * W_STRIPS, 0, 420, 70), picks: weave(t, n, 420, 260, 1000 / n * .72), gap: 1 - seg(t, 1480, 1780), ghost: 0 }) },
    working: { dur: 3200, loop: true, pose: (t, n) => t < 200
      ? { warp: full(), picks: new Array(n).fill(1 - seg(t, 0, 200)), gap: 1, ghost: .2 }
      : { warp: full(), picks: weave(t, n, 220, 220, 1500 / n), gap: 1 - seg(t, 1900, 2200), ghost: .2 } },
    hover: { dur: 600, loop: false, pose: (t, n) => ({ warp: full(), picks: weave(t, n, 0, 260, 220 / n), gap: 1 - seg(t, 380, 600), ghost: 0 }) },
    done: { dur: 700, loop: false, pose: (t, n) => ({ warp: full(), picks: new Array(n).fill(1), gap: Math.sin(Math.PI * seg(t, 0, 700)), ghost: 0 }) },
  };

  let uid = 0;
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // Builds one mark; layering follows the master: short stubs, shuttle, long bars on top
  function makeMark(width, height, picks, ink, red) {
    const id = "m" + (++uid);
    const svg = el("svg", { viewBox: "-172 -112 344 224", width, height });
    const defs = el("defs", {}, svg);
    const mw = el("mask", { id: id + "W", maskUnits: "userSpaceOnUse", x: -400, y: -300, width: 800, height: 600 }, defs);
    const sw = W_W / W_STRIPS, warpRects = [];
    for (let j = 0; j < 2 * W_STRIPS; j++) {
      const left = j < W_STRIPS, k = left ? j : j - W_STRIPS;
      const x = left ? -(W_X + W_W) + k * sw : (W_X + W_W) - (k + 1) * sw;
      warpRects.push({ left, r: el("rect", { x: x - .3, y: -100, width: sw + .6, height: 0, fill: "#fff" }, mw) });
    }
    const ms = el("mask", { id: id + "S", maskUnits: "userSpaceOnUse", x: -400, y: -300, width: 800, height: 600 }, defs);
    const g = el("g", { transform: `rotate(${AXIS})` }, ms);
    const pitch = 2 * S_HALF / picks, pickRects = [];
    for (let i = 0; i < picks; i++) pickRects.push(el("rect", { x: -S_LEN, y: -S_HALF + i * pitch, width: 0, height: pitch, fill: "#fff" }, g));

    const W = el("g", { mask: `url(#${id}W)`, fill: ink }, svg);
    el("use", { href: "#sg-stub" }, W);
    el("use", { href: "#sg-stub", transform: "rotate(180)" }, W);
    const ghost = el("use", { href: "#sg-shuttle", fill: red, opacity: 0 }, svg);
    const S = el("g", { mask: `url(#${id}S)`, fill: red }, svg);
    el("use", { href: "#sg-shuttle" }, S);
    const WB = el("g", { mask: `url(#${id}W)`, fill: ink }, svg);
    el("use", { href: "#sg-bar" }, WB);
    el("use", { href: "#sg-bar", transform: "rotate(180)" }, WB);

    // Overlap between neighbouring strips once the gap closes, so antialiased mask edges leave no seam
    const overlap = SEAM_OVERLAP_PX * 344 / width;
    return { svg, apply(p) {
      const gap = p.gap < GAP_EPSILON ? 0 : p.gap;
      warpRects.forEach(({ left, r }, j) => {
        const h = 200 * p.warp[j];
        r.setAttribute("height", h);
        r.setAttribute("y", left ? -100 : 100 - h);
      });
      const thin = pitch * .36 * gap;
      const grow = overlap * (1 - gap);
      pickRects.forEach((r, i) => {
        const w = 2 * S_LEN * p.picks[i];
        r.setAttribute("x", i % 2 === 0 ? -S_LEN : S_LEN - w);
        r.setAttribute("width", w);
        r.setAttribute("y", -S_HALF + i * pitch + thin / 2 - grow / 2);
        r.setAttribute("height", Math.max(0, pitch - thin + grow));
      });
      // Fully revealed parts draw unmasked, so the rest frame is exactly the master mark
      const warpDone = p.warp.every(v => v >= 1);
      const shuttleDone = gap === 0 && p.picks.every(v => v >= 1);
      [W, WB].forEach(n => warpDone ? n.removeAttribute("mask") : n.setAttribute("mask", `url(#${id}W)`));
      shuttleDone ? S.removeAttribute("mask") : S.setAttribute("mask", `url(#${id}S)`);
      ghost.setAttribute("opacity", p.ghost);
    } };
  }

  // paths: { stub, bar, shuttle } path data taken from the master mark SVG
  window.setMarkPaths = (paths) => {
    const defs = document.getElementById("mark-defs");
    defs.textContent = "";
    el("path", { id: "sg-stub", d: paths.stub }, defs);
    el("path", { id: "sg-bar", d: paths.bar }, defs);
    el("path", { id: "sg-shuttle", d: paths.shuttle, "fill-rule": "evenodd" }, defs);
  };

  // Frame count: loops sample [0, dur); one-shots include the final rest frame
  window.frameCount = (motion, fps) => {
    const m = MOTIONS[motion];
    const n = Math.round(m.dur / 1000 * fps);
    return m.loop ? n : n + 1;
  };

  // Timing facts written into the manifest
  window.motionInfo = (motion) => ({ loop: MOTIONS[motion].loop, durationMs: MOTIONS[motion].dur });

  // spec: { motion, fps, frameWidth, frameHeight, picks, columns, padding, ink, red } -> sheet size in px
  window.renderSheet = (spec) => {
    const sheet = document.getElementById("sheet");
    sheet.textContent = "";
    const m = MOTIONS[spec.motion];
    const count = window.frameCount(spec.motion, spec.fps);
    const cellW = spec.frameWidth + spec.padding, cellH = spec.frameHeight + spec.padding;
    const rows = Math.ceil(count / spec.columns);
    for (let i = 0; i < count; i++) {
      const t = Math.min(i * 1000 / spec.fps, m.dur);
      const mark = makeMark(spec.frameWidth, spec.frameHeight, spec.picks, spec.ink, spec.red);
      mark.apply(m.pose(t, spec.picks));
      mark.svg.style.left = (i % spec.columns) * cellW + "px";
      mark.svg.style.top = Math.floor(i / spec.columns) * cellH + "px";
      sheet.appendChild(mark.svg);
    }
    const width = Math.min(count, spec.columns) * cellW - spec.padding;
    const height = rows * cellH - spec.padding;
    sheet.style.width = width + "px";
    sheet.style.height = height + "px";
    return { count, rows, width, height };
  };
})();
</script>
</body>
</html>

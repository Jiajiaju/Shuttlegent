; Shuttlegent plugin defaults for the project settings (Project Settings > Shuttlegent > General, Shuttlegent.md section 11).
; A project sets its skills, templates, external MCP servers and UI guides in its own Config/DefaultShuttlegent.ini, and
; may add to the engine toolset lists below with +Entry= or drop a default with -Entry=. Model providers, their URLs and
; keys, the values of MCP header variables and the permission switches are personal (Editor Preferences > Shuttlegent > General).

[/Script/ShuttlegentCore.ShuttlegentProjectSettings]
; Engine toolsets for programmers, or that switch plugins, drive the editor UI or connect other MCP servers
+BlockedToolsetNames=LiveCodingToolset
+BlockedToolsetNames=AutomationTestToolset
+BlockedToolsetNames=PluginToolset
+BlockedToolsetNames=GameFeaturesToolset
+BlockedToolsetNames=SlateInspectorToolset
+BlockedToolsetNames=MCPClientToolset
; Image results are not passed to the model yet
+BlockedToolsetNames=/\.Capture[A-Za-z]*$/
+BlockedToolsetNames=/\.Screenshot$/

+ReadOnlyToolPrefixes=Get
+ReadOnlyToolPrefixes=List
+ReadOnlyToolPrefixes=Find
+ReadOnlyToolPrefixes=Search
+ReadOnlyToolPrefixes=Describe
+ReadOnlyToolPrefixes=Is
+ReadOnlyToolPrefixes=Has
+ReadOnlyToolPrefixes=Query
+ReadOnlyToolPrefixes=Discover

+ReadOnlyTools=ScreenCoordsToWorld
+ReadOnlyTools=WorldPosToScreenCoords
+ReadOnlyTools=ValidateNewPluginNameAndLocation
+ReadOnlyTools=UEnum_Info

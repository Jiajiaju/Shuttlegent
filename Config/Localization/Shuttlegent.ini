[CommonSettings]
SourcePath=%LOCPROJECTROOT%Plugins/Shuttlegent/Content/Localization/Shuttlegent
DestinationPath=%LOCPROJECTROOT%Plugins/Shuttlegent/Content/Localization/Shuttlegent
ManifestName=Shuttlegent.manifest
ArchiveName=Shuttlegent.archive
PortableObjectName=Shuttlegent.po
ResourceName=Shuttlegent.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Plugins/Shuttlegent/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true

;Write Text Localization Report
[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
DestinationPath=%LOCPROJECTROOT%Saved/Localization/Shuttlegent
bWordCountReport=true
WordCountReportName=Shuttlegent.csv
bConflictReport=true
ConflictReportName=ShuttlegentConflicts.csv

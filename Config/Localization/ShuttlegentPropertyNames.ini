[CommonSettings]
SourcePath=%LOCPROJECTROOT%Plugins/Shuttlegent/Content/Localization/ShuttlegentPropertyNames
DestinationPath=%LOCPROJECTROOT%Plugins/Shuttlegent/Content/Localization/ShuttlegentPropertyNames
ManifestName=ShuttlegentPropertyNames.manifest
ArchiveName=ShuttlegentPropertyNames.archive
PortableObjectName=ShuttlegentPropertyNames.po
ResourceName=ShuttlegentPropertyNames.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

;Gather text from metadata
[GatherTextStep0]
CommandletClass=GatherTextFromMetaData
ModulesToPreload=ShuttlegentCore
IncludePathFilters=%LOCPROJECTROOT%Plugins/Shuttlegent/Source/ShuttlegentCore/*
FieldOuterTypesToExclude=Function
InputKeys=DisplayName
OutputNamespaces=UObjectDisplayNames
OutputKeys="{FieldPath}"
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true

;Write Text Localization Report
[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
DestinationPath=%LOCPROJECTROOT%Saved/Localization/Shuttlegent
bWordCountReport=true
WordCountReportName=ShuttlegentPropertyNames.csv
bConflictReport=true
ConflictReportName=ShuttlegentPropertyNamesConflicts.csv

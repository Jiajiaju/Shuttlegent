[CommonSettings]
SourcePath=%LOCPROJECTROOT%Plugins/Shuttlegent/Content/Localization/ShuttlegentToolTips
DestinationPath=%LOCPROJECTROOT%Plugins/Shuttlegent/Content/Localization/ShuttlegentToolTips
ManifestName=ShuttlegentToolTips.manifest
ArchiveName=ShuttlegentToolTips.archive
PortableObjectName=ShuttlegentToolTips.po
ResourceName=ShuttlegentToolTips.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

;Gather text from metadata
[GatherTextStep0]
CommandletClass=GatherTextFromMetaData
ModulesToPreload=ShuttlegentCore
IncludePathFilters=%LOCPROJECTROOT%Plugins/Shuttlegent/Source/ShuttlegentCore/*
InputKeys=ToolTip
OutputNamespaces=UObjectToolTips
OutputKeys="{FieldPath}"
InputKeys=ShortTooltip
OutputNamespaces=UObjectShortTooltips
OutputKeys="{FieldPath}"
ShouldGatherFromEditorOnlyData=true

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true

;Write Text Localization Report
[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
DestinationPath=%LOCPROJECTROOT%Saved/Localization/Shuttlegent
bWordCountReport=true
WordCountReportName=ShuttlegentToolTips.csv
bConflictReport=true
ConflictReportName=ShuttlegentToolTipsConflicts.csv

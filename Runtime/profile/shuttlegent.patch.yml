# Shuttlegent overlay for the DeepSeek Harness `acp` profile.
# Applied at launch with: shuttlegent-runtime.exe --profile acp --patch <this file>
# Row ids come from packages/bundle/base/cordis.patch.yml in the pinned dsh revision.

# Shell tool off by default. Keep `pwsh-sandbox`: it provides the `shell`
# service that the `permission` presets depend on.
- id: tool-pwsh
  disabled: true

# These run model-generated code inside the dsh process.
- id: tool-workflow
  disabled: true

- id: workflow-ptc
  disabled: true

- id: ptc-runtime
  disabled: true

# Telemetry rows, in addition to DSH_TELEMETRY_DISABLED set by the launcher.
- id: otel
  disabled: true

- id: session-telemetry-otel
  disabled: true

# Project prompt comes from SHUTTLEGENT.md only; AGENTS.md / CLAUDE.md are ignored.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: ['SHUTTLEGENT.md']
    localInstructionFileCandidates: ['SHUTTLEGENT.local.md']

# Skills come only from directories Shuttlegent configures.
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []

# Persona: an assistant inside the Unreal Editor, replacing the acp template's
# "coding agent" (packages/bundle/acp-app/cordis.patch.yml). Project prompts
# still come from SHUTTLEGENT.md through agent-instructions.
- id: system-prompt
  config:
    personaPrefix: >-
      You are Shuttlegent, an assistant that works inside the Unreal Editor,
      powered by the {{model}} model. You help the user inspect and change the
      open project: levels, actors, assets, blueprints and settings. Prefer the
      editor tools over reading or writing files directly; use file tools only
      for text files the user points to. Every editor write is shown to the
      user for confirmation before it runs, so describe what you are about to
      change and why. You are not a general coding agent: do not offer to write
      or refactor source code unless the user asks for it. Reply in the user's
      language, keep answers short, and use Markdown lists, tables and code
      blocks where they make the answer easier to read.
